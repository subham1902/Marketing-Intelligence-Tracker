# Market Intelligence Tracker: production stack for a single VM.
# Usage (from the deploy/ folder): docker compose up -d --build
name: mit

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      COMPETE_DATA_DIR: /data
      COMPETE_DUCKDB_PATH: /data/compete.duckdb
      COMPETE_CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
    volumes:
      - mit_data:/data
    restart: unless-stopped
    # Not published to the internet: only the web container reaches it.

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  mit_data:
  caddy_data:
  caddy_config:
