# Keeps the free Render API awake (it sleeps after 15 min idle) so visitors never
# wait for a cold start. Set the repository variable API_HEALTH_URL to
# https://<your-render-service>.onrender.com/api/health (Settings > Secrets and variables > Actions > Variables).
name: keep-api-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 90 --retry 2 "${{ vars.API_HEALTH_URL }}" || echo "API did not answer (will retry next run)"
